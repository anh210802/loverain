<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Dành Cho Phương Anh</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Màn hình chờ mở quà */
        #gift-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0818 0%, #030308 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease, transform 1s ease;
        }

        #gift-screen.opened {
            opacity: 0;
            transform: scale(1.3);
            pointer-events: none;
        }

        .gift-box {
            font-size: 95px;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 0 25px rgba(255, 77, 136, 0.8));
            animation: bounceGift 1.5s infinite ease-in-out;
            transition: transform 0.2s;
        }

        .gift-box:hover {
            transform: scale(1.15);
        }

        .gift-title {
            margin-top: 25px;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 12px #ff4d88, 0 0 25px #ff1a66;
            padding: 0 20px;
        }

        .gift-sub {
            margin-top: 10px;
            color: #ffb3cc;
            font-size: 1rem;
            letter-spacing: 0.5px;
            animation: blinkText 1.5s infinite alternate;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-12px) rotate(-6deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-8px) rotate(6deg); }
        }

        @keyframes blinkText {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Trang nhấn mở quà -->
    <div id="gift-screen">
        <div class="gift-box" id="openBtn">🎁</div>
        <div class="gift-title">Gửi Phương Anh một món quà nhỏ 🤍</div>
        <div class="gift-sub">Chạm vào hộp quà để mở nhé!</div>
    </div>

    <!-- Hiệu ứng mưa tình yêu 3D -->
    <canvas id="loveRain"></canvas>

    <script>
        const giftScreen = document.getElementById('gift-screen');
        const openBtn = document.getElementById('openBtn');
        const canvas = document.getElementById('loveRain');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let isStarted = false;

        // 1. TÙY CHỈNH CHỮ RƠI TẠI ĐÂY
        const words = ["Yêu Phương Anh", "Yêu em", "Mãi iu", "Phương Anh 🤍", "Love You", "Thương em"];

        // 2. TÙY CHỈNH LINK ẢNH TẠI ĐÂY
        const imageUrls = [
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3hph3Vpwjd0xzkXL64FnWuHd00oOCH0SoYnmffJeFtA&s=10",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnkmqoEfJFEFgVpsj1mMwpUfT63vtIeWIKbDGCmugHew&s=10",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQVx1mKYsviOg4YAstsYXAjARhacOzgM3ufCzFSE62aQ&s=10"
        ];

        // Tải trước hình ảnh
        const loadedImages = [];
        imageUrls.forEach(url => {
            const img = new Image();
            img.src = url;
            img.onload = () => loadedImages.push(img);
        });

        // Tạo các hạt sao lấp lánh ở nền
        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5,
            alpha: Math.random()
        }));

        // Khởi tạo các vật thể rơi trong không gian 3D
        const items = [];
        const totalItems = 300;

        function createItem(initial = false) {
            const rand = Math.random();
            let type = 'text';
            
            // Tỉ lệ xuất hiện: ~10% Ảnh, ~50% Trái tim, ~40% Chữ
            if (rand > 0.90 && loadedImages.length > 0) {
                type = 'image';
            } else if (rand > 0.40) {
                type = 'heart';
            }

            const z = 0.3 + Math.random() * 1.4; 
            return {
                type: type,
                x: (Math.random() - 0.5) * width * 1.8,
                y: initial ? (Math.random() - 0.5) * height * 1.5 : -height * 0.8,
                z: z,
                speed: (1.2 + Math.random() * 1.8) * z,
                word: words[Math.floor(Math.random() * words.length)],
                img: loadedImages[Math.floor(Math.random() * loadedImages.length)],
                size: type === 'heart' ? (14 + Math.random() * 28) : (18 + Math.random() * 10)
            };
        }

        function initItems() {
            items.length = 0;
            for (let i = 0; i < totalItems; i++) {
                items.push(createItem(true));
            }
        }

        // Hàm vẽ trái tim đỏ
        function drawHeart(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "#ff2a1a";
            ctx.shadowColor = "#ff1a00";
            ctx.shadowBlur = 15;
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
            ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.3, 0, size);
            ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.3, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            if (!isStarted) return;

            ctx.fillStyle = "#030308";
            ctx.fillRect(0, 0, width, height);

            // Vẽ sao nền
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Sắp xếp theo độ sâu z
            items.sort((a, b) => a.z - b.z);

            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.rotate(-0.18);

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const scale = item.z;
                const drawX = item.x * scale;
                const drawY = item.y * scale;

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.scale(scale, scale);

                if (item.type === 'text') {
                    ctx.font = `600 ${item.size}px 'Segoe UI', sans-serif`;
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "#70d6ff";
                    ctx.shadowBlur = 14;
                    ctx.fillText(item.word, 0, 0);
                } 
                else if (item.type === 'heart') {
                    drawHeart(0, 0, item.size);
                } 
                else if (item.type === 'image' && item.img) {
                    const imgW = 95;
                    const imgH = 120;
                    ctx.shadowColor = "#ffffff";
                    ctx.shadowBlur = 12;
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                    ctx.lineWidth = 2;
                    ctx.drawImage(item.img, -imgW / 2, -imgH / 2, imgW, imgH);
                    ctx.strokeRect(-imgW / 2, -imgH / 2, imgW, imgH);
                }

                ctx.restore();

                item.y += item.speed;

                if (item.y * scale > height * 0.85) {
                    items[i] = createItem(false);
                }
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }

        // Sự kiện bấm mở hộp quà
        openBtn.addEventListener('click', () => {
            if (isStarted) return;
            isStarted = true;
            giftScreen.classList.add('opened');
            initItems();
            animate();
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
